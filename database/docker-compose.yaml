volumes

services:
  database: 
    image: postgres:latest
    container_name: postgres
    env_file:
      - e./.env
    ports:
      - 5432:5432
    volumes:
      - database-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5